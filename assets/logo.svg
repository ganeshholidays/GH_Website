<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional, for standalone use) -->
  
  <!-- Ganesh Head - stylized with crown -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="50%" style="stop-color:#d4a229"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  
  <!-- Crown/Top ornament -->
  <path d="M100 12 L96 22 L100 18 L104 22 Z" fill="url(#goldGrad)" stroke="#b8860b" stroke-width="0.5"/>
  <ellipse cx="100" cy="10" rx="3" ry="4" fill="url(#goldGrad)"/>
  
  <!-- Crown base arcs -->
  <path d="M82 35 Q88 25 100 22 Q112 25 118 35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 40 Q92 30 100 28 Q108 30 115 40" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Head outline -->
  <path d="M72 65 Q72 38 100 35 Q128 38 128 65 Q128 80 115 88 Q105 94 100 95 Q95 94 85 88 Q72 80 72 65" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.8"/>
  
  <!-- Left Ear -->
  <path d="M72 55 Q60 50 55 60 Q50 72 55 82 Q60 90 72 85" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ear inner -->
  <path d="M70 60 Q63 58 60 65 Q57 73 60 78 Q63 83 70 80" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Right Ear -->
  <path d="M128 55 Q140 50 145 60 Q150 72 145 82 Q140 90 128 85" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ear inner -->
  <path d="M130 60 Q137 58 140 65 Q143 73 140 78 Q137 83 130 80" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Eye (left) -->
  <ellipse cx="88" cy="62" rx="5" ry="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <ellipse cx="89" cy="62" rx="2" ry="2" fill="url(#goldGrad)"/>
  
  <!-- Eye (right) -->
  <ellipse cx="112" cy="62" rx="5" ry="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <ellipse cx="113" cy="62" rx="2" ry="2" fill="url(#goldGrad)"/>
  
  <!-- Trunk - curving down and to the left, forming road shape -->
  <path d="M100 78 Q98 85 95 92 Q90 102 85 112 Q78 125 72 132 Q68 136 70 140 Q74 142 78 138 Q85 130 92 118 Q98 108 102 100 Q105 108 112 120" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Trunk curl at bottom -->
  <path d="M70 140 Q66 145 68 148 Q72 152 76 148 Q78 144 74 140" 
        fill="url(#goldGrad)" stroke="none"/>
  
  <!-- Road/Highway extending from trunk (right side) -->
  <path d="M112 120 Q125 135 140 142 Q155 148 170 148" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M108 125 Q120 140 135 148 Q150 155 168 155" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Road dashes -->
  <line x1="125" y1="135" x2="130" y2="137" stroke="#d4a229" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="140" y1="143" x2="148" y2="145" stroke="#d4a229" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Small car on the road -->
  <g transform="translate(152, 140) rotate(-8)">
    <!-- Car body -->
    <rect x="0" y="2" width="18" height="7" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1.3"/>
    <!-- Car roof -->
    <path d="M4 2 L6 -2 L14 -2 L16 2" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Wheels -->
    <circle cx="5" cy="10" r="2" fill="url(#goldGrad)"/>
    <circle cx="14" cy="10" r="2" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Mountains silhouette (behind road) -->
  <path d="M130 155 L140 138 L148 150 L155 135 L165 155" 
        fill="none" stroke="#b8860b" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Decorative dot (forehead tikka) -->
  <circle cx="100" cy="48" r="3" fill="url(#goldGrad)"/>
  
</svg>
